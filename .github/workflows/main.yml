name: Unzip
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o "*.zip"
          rm -f *.zip
          git config user.name "Auto"
          git config user.email "auto@github.com"
          git add .
          git commit -m "Unzipped files"
          git push
