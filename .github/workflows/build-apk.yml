name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build Web
        run: |
          npm install --legacy-peer-deps
          npx vite build
          mkdir -p www
          INDEX_PATH=$(find .vercel .output dist -name "index.html" 2>/dev/null | head -n 1)
          if [ -n "$INDEX_PATH" ]; then
            BUILD_DIR=$(dirname "$INDEX_PATH")
            echo "Found build at: $BUILD_DIR"
            cp -r "$BUILD_DIR"/* www/
          else
            echo "Build files:"
            find . -maxdepth 4 -not -path '*/.*'
            exit 1
          fi
      - name: Setup Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "ReadingPhoto" "com.dawaran.readingphoto" --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Reading-Photo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
