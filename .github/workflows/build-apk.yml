name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build Web SPA
        run: |
          npm install --legacy-peer-deps
          sed -i 's/tanstackStart()/tanstackStart({ spa: { enabled: true } })/g' vite.config.ts
          npx vite build
          mkdir -p www
          cp -r .vercel/output/static/* www/ 2>/dev/null || true
          if [ ! -f "www/index.html" ] && [ -f "www/_shell.html" ]; then
            cp www/_shell.html www/index.html
          fi
          if [ ! -f "www/index.html" ]; then
            FOUND=$(find .vercel .output dist -name "*.html" 2>/dev/null | head -n 1)
            if [ -n "$FOUND" ]; then
              cp -r "$(dirname "$FOUND")"/* www/
              cp "$FOUND" www/index.html
            fi
          fi
          ls -la www/
      - name: Setup Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "ReadingPhoto" "com.dawaran.readingphoto" --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Reading-Photo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
